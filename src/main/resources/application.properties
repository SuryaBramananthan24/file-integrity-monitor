spring.application.name=file-integrity-monitor
monitoring.interval=20000
monitoring.file-path=monitored-files/application.log
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=always

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/file_integrity_monitor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:surya2004}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true